name: Deploy Sandbox Environment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Sandbox
    permissions:
      id-token: write # Required for AWS authentication via OIDC
      contents: read
    uses: ./.github/workflows/infra.yml
    with:
      instance_name: fintu-sandbox
      web_domain: app.sandbox.fintu.com
      api_domain: api.sandbox.fintu.com
      environment: sandbox
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}
      supabase_database_url: ${{ secrets.DATABASE_URL }}
      supabase_url: ${{ secrets.SUPABASE_URL }}
      supabase_jwt_secret: ${{ secrets.SUPABASE_JWT_SECRET }}
      twelve_data_api_key: ${{ secrets.TWELVE_DATA_API_KEY }}
      next_public_supabase_url: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      next_public_supabase_anon_key: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      next_public_google_client_id: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
